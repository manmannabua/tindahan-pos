# Single origin: the Next.js app and the API are served from the same host, so refresh
# cookies are first-party and no CORS is needed. Replace pos.example.com with your domain.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Anonymous visitors of public store catalogs (/s/<store> pages and /api/v1/public/).
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
# Micro-cache for public catalog API responses: a burst of shoppers (or a scraper) costs the
# API one request per URL every 10 s. Stock therefore lags by at most ~10 s here + 30 s in Redis.
proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public_catalog:10m
                 max_size=200m inactive=10m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api { server api:8000; keepalive 32; }
upstream web { server web:3000; keepalive 16; }

server {
    listen 80;
    server_name pos.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pos.example.com;

    ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 20m;   # CSV/Excel imports
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api;
    }

    location /api/v1/ws {
        proxy_pass http://api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Public catalog API: anonymous, read-only, cached. Credentials are stripped so a
    # logged-in owner's request can never be cached or served to someone else.
    location /api/v1/public/ {
        limit_req zone=public burst=40 nodelay;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_cache public_catalog;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://api;
    }

    # The service worker (served by Serwist under /serwist/) must be revalidated on every load
    # so terminals receive updates.
    location /serwist/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_pass http://web;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://web;
    }

    # Public store pages (server-rendered by Next.js).
    location /s/ {
        limit_req zone=public burst=40 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://web;
    }

    location / {
        proxy_set_header Connection "";
        proxy_pass http://web;
    }
}
