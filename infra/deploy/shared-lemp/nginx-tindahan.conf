# /etc/nginx/sites-available/tindahan — Tindahan POS on shared-lemp-vm (native, no Docker).
# /api/* goes straight to FastAPI (127.0.0.1:8730); everything else to Next.js (127.0.0.1:3330).
# Zone and cache names are prefixed `tindahan_`: this file is included in the shared http {}.

limit_req_zone $binary_remote_addr zone=tindahan_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tindahan_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tindahan_public:10m rate=10r/s;
# Online-catalog micro-cache (see docs/ONLINE_CATALOG.md §3).
proxy_cache_path /var/cache/nginx/tindahan_public levels=1:2 keys_zone=tindahan_catalog_cache:10m
                 max_size=200m inactive=10m use_temp_path=off;

map $http_upgrade $tindahan_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tindahan_api { server 127.0.0.1:8730; keepalive 16; }
upstream tindahan_web { server 127.0.0.1:3330; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name tindahan.for-demo.online;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tindahan.for-demo.online;

    ssl_certificate     /etc/letsencrypt/live/tindahan.for-demo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tindahan.for-demo.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;   # CSV imports (10 MB) and product photos (2 MB)
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Next.js sets the CSP and the other page headers; these cover the API as well.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (never append): the API rate-limits by the client address uvicorn derives.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=tindahan_auth burst=20 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://tindahan_api;
    }

    location /api/v1/ws {
        proxy_pass http://tindahan_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tindahan_connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Product photos: immutable file names, served from disk without touching the API.
    location /api/v1/media/ {
        alias /srv/tindahan/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public online catalog API: anonymous, read-only, cached; credentials stripped so an
    # owner's request can never be cached or served to someone else.
    location /api/v1/public/ {
        limit_req zone=tindahan_public burst=40 nodelay;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_cache tindahan_catalog_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503;
        add_header X-Cache $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://tindahan_api;
    }

    location /api/ {
        limit_req zone=tindahan_api burst=100 nodelay;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://tindahan_api;
    }

    # The POS service worker must be revalidated on every load so terminals get updates.
    location /serwist/ {
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://tindahan_web;
    }

    location /_next/static/ {
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://tindahan_web;
    }

    # Public store pages (server-rendered): same visitor limit as the public API.
    location /s/ {
        limit_req zone=tindahan_public burst=40 nodelay;
        proxy_set_header Connection "";
        proxy_pass http://tindahan_web;
    }

    location / {
        proxy_set_header Connection "";
        proxy_pass http://tindahan_web;
    }
}
