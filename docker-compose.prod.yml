# Production stack on a single VM. See docs/DEPLOYMENT.md.
#   cp infra/.env.prod.example .env.prod   (fill in secrets)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Nginx publishes ports. PostgreSQL and Redis are reachable only on the internal network.

name: pos

x-backend: &backend
  build: { context: ./backend }
  restart: unless-stopped
  env_file: .env.prod
  environment:
    ENVIRONMENT: production
    LOG_JSON: "true"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [internal]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule

  web:
    build: { context: ./frontend, target: runtime }
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/pos.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./infra/nginx/acme:/var/www/acme:ro
    depends_on: [api, web]
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
